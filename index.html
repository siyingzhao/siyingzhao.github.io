<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="昭思应的个人主页、写作与联系方式。">
  <title>昭思应 · 昭思应的半位面</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: white; color: #202124; font: 16px/1.75 Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 824px; margin: auto; padding: 64px 28px 32px; }
    a { color: #1769a6; text-decoration: none; }
    a:hover, a:focus-visible { color: #995100; text-decoration: underline; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 48px; }
    header img { width: 172px; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 50%; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 36px; font-weight: 550; letter-spacing: .06em; }
    header p { margin: 12px 0; }
    nav { display: flex; flex-wrap: wrap; gap: 0 18px; }
    section { margin-top: 60px; }
    h2 { font-size: 24px; font-weight: 500; }
    article { display: grid; grid-template-columns: 152px 1fr; align-items: center; gap: 26px; margin: 26px 0; }
    .thumbnail { display: grid; place-items: center; min-height: 104px; background: #eff3f5; color: #38516b; font: italic 30px Georgia, serif; }
    .code { background: #f5f1eb; color: #70573d; font: 19px "Courier New", monospace; }
    h3 { font-size: 17px; }
    time, footer { color: #636769; font-size: 14px; }
    article p { margin-top: 4px; }
    footer { border-top: 1px solid #e6e6e6; margin-top: 48px; padding-top: 16px; }
    @media (max-width: 620px) {
      main { padding: 32px 20px; }
      header { flex-direction: column-reverse; align-items: flex-start; gap: 12px; }
      header img { width: 108px; }
      section { margin-top: 36px; }
      article { grid-template-columns: 84px 1fr; gap: 14px; }
      .thumbnail { min-height: 84px; font-size: 21px; }
      .code { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>昭思应</h1>
        <p>欢迎来到我的半位面。这里收录了我的文章和建站笔记。</p>
        <nav aria-label="个人链接">
          <a href="mailto:pbs23@mails.tsinghua.edu.cn">邮箱</a>
          <a href="https://github.com/siyingzhao">GitHub</a>
          <a href="archives/">文章归档</a>
        </nav>
      </div>
      <img src="images/avatar.jpg" width="172" height="172" alt="昭思应的头像">
    </header>
    <section aria-labelledby="writing">
      <h2 id="writing">文章与笔记</h2>
      <article>
        <div class="thumbnail" aria-hidden="true">∫ f(x) dx</div>
        <div>
          <h3><a href="2026/03/04/math-test/">MathJax 公式渲染测试</a></h3>
          <time datetime="2026-03-04">2026 年 3 月 4 日</time>
          <p>用数学公式检查 MathJax 在博客中的排版效果。</p>
        </div>
      </article>
      <article>
        <div class="thumbnail code" aria-hidden="true">&gt; hello_</div>
        <div>
          <h3><a href="2026/03/04/hello-world/">Hello World - 测试博文</a></h3>
          <time datetime="2026-03-04">2026 年 3 月 4 日</time>
          <p>用第一篇测试文章验证博客的生成流程。</p>
        </div>
      </article>
    </section>
    <footer>
      <nav aria-label="博客导航">
        <a href="about/">关于</a>
        <a href="tags/">标签</a>
        <a href="categories/">分类</a>
        <a href="resources/">资源</a>
      </nav>
    </footer>
  </main>
</body>
</html>
